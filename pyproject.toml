[project]
name = "dsa-interviewprep"
version = "0.1.0"
description = "This is a repository with all my work on Data Structures & Algorithms"
readme = "README.md"
authors = [
    { name = "kostas tzaf", email = "gus_tzaf@hotmail.gr" }
]

requires-python = ">=3.13"

dependencies = []


[project.scripts]
dsa-interviewprep = "dsa_interviewprep:main"


[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"


# -------------------------
# uv
# -------------------------

[tool.uv]
link-mode = "copy"


# -------------------------
# Ruff
# -------------------------

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F"
]

ignore = [
    "E501",
]


# -------------------------
# Pyright
# -------------------------

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

reportMissingImports = "warning"
reportMissingTypeStubs = "none"

reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"

reportUnusedImport = "none"
reportUnusedVariable = "none"


# -------------------------
# Development dependencies
# -------------------------

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff",
    "pyright",
]